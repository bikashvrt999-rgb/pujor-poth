<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pujor Poth</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#090611;
    color:white;
    overflow-x:hidden;
}

/* ---------- HERO ---------- */

.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    background:
      radial-gradient(circle at 50% 35%,#64131f 0%,#220812 35%,#090611 75%);
    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"🪔";
    position:absolute;
    font-size:220px;
    opacity:.07;
    animation:glow 3s infinite alternate;
}

@keyframes glow{
    from{transform:scale(.9);opacity:.04}
    to{transform:scale(1.1);opacity:.10}
}

.logo{
    font-size:clamp(42px,12vw,80px);
    font-weight:900;
    letter-spacing:4px;
    color:#ffd66b;
    text-shadow:
      0 0 10px #ff9d00,
      0 0 30px #ff4d00;
    animation:titleIn 1.5s ease;
}

@keyframes titleIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.8);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.tagline{
    margin-top:12px;
    font-size:18px;
    color:#ffdede;
}

.start-btn{
    margin-top:40px;
    padding:16px 35px;
    border:none;
    border-radius:50px;
    font-size:17px;
    font-weight:bold;
    background:linear-gradient(45deg,#ff512f,#f09819);
    color:white;
    box-shadow:0 0 25px #ff5b24;
    cursor:pointer;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{box-shadow:0 0 40px #ff8c42}
}

/* ---------- MAP ---------- */

#mapPage{
    display:none;
    min-height:100vh;
    padding:25px 15px 60px;
    background:
      radial-gradient(circle at top,#351127,#090611 60%);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#ffd66b;
    font-size:35px;
}

.header p{
    color:#d8c8d0;
    margin-top:6px;
}

/* route buttons */

.routes{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.route-btn{
    padding:12px 17px;
    border-radius:30px;
    border:1px solid #ffffff30;
    background:#ffffff0d;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.route-btn:hover{
    transform:translateY(-3px);
}

.green.active{
    background:#16a34a;
    box-shadow:0 0 20px #16a34a;
}

.blue.active{
    background:#2563eb;
    box-shadow:0 0 20px #2563eb;
}

.red.active{
    background:#dc2626;
    box-shadow:0 0 20px #dc2626;
}

/* map */

.map{
    max-width:650px;
    margin:auto;
    min-height:600px;
    position:relative;
    border:1px solid #ffffff20;
    border-radius:30px;
    background:
      linear-gradient(135deg,#12101d,#211326);
    box-shadow:0 0 40px #000;
    overflow:hidden;
    padding:25px;
}

.map::before{
    content:"PUJA MAP";
    position:absolute;
    top:20px;
    right:20px;
    font-size:11px;
    color:#ffffff40;
    letter-spacing:3px;
}

/* route line */

.route-line{
    position:absolute;
    left:50%;
    top:70px;
    width:5px;
    height:500px;
    transform:translateX(-50%);
    background:#ffffff15;
    border-radius:10px;
}

.route-line::after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:var(--routeColor,#16a34a);
    box-shadow:0 0 15px var(--routeColor,#16a34a);
    transform-origin:top;
    transform:scaleY(0);
    animation:drawRoute 1.5s forwards;
}

@keyframes drawRoute{
    to{transform:scaleY(1)}
}

/* stops */

.stops{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:13px;
}

.stop{
    width:100%;
    max-width:280px;
    padding:13px 18px;
    border-radius:15px;
    background:#ffffff0b;
    border:1px solid #ffffff20;
    backdrop-filter:blur(10px);
    cursor:pointer;
    transition:.3s;
    text-align:center;
}

.stop:hover{
    transform:scale(1.04);
    background:#ffffff16;
}

.dot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--routeColor,#16a34a);
    box-shadow:0 0 15px var(--routeColor,#16a34a);
    margin-right:8px;
}

.food{
    display:inline-block;
    margin-left:7px;
    font-size:12px;
}

/* ---------- INFO ---------- */

.info{
    max-width:650px;
    margin:25px auto 0;
    padding:22px;
    border-radius:25px;
    background:#ffffff09;
    border:1px solid #ffffff18;
    display:none;
    animation:fadeUp .5s ease;
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

.info h2{
    color:#ffd66b;
    margin-bottom:12px;
}

.mike{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#ffffff12;
    font-size:32px;
    cursor:pointer;
    box-shadow:0 0 20px #ffffff20;
    margin:10px 0;
}

.food-list{
    margin-top:15px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.food-item{
    padding:8px 12px;
    border-radius:20px;
    background:#ff7b1830;
    border:1px solid #ff9d4040;
}

/* mobile */

@media(max-width:500px){
    .map{
        min-height:650px;
    }

    .stop{
        max-width:245px;
        font-size:14px;
    }

    .route-line{
        height:550px;
    }
}
</style>
</head>

<body>

<!-- HERO -->

<section class="hero" id="home">
    <div class="logo">PUJOR POTH</div>
    <div class="tagline">পথে পথে পুজোর গল্প 🪔</div>

    <button class="start-btn" onclick="openMap()">
        🗺️ ENTER PUJOR POTH
    </button>
</section>


<!-- MAP PAGE -->

<section id="mapPage">

    <div class="header">
        <h1>🪔 Pujor Poth</h1>
        <p>Choose your Puja route</p>
    </div>

    <div class="routes">
        <button class="route-btn green"
                onclick="showRoute('saptami')">
            🟢 Saptamir Poth
        </button>

        <button class="route-btn blue"
                onclick="showRoute('astami')">
            🔵 Astamir Poth
        </button>

        <button class="route-btn red"
                onclick="showRoute('navami')">
            🔴 Nabamir Poth
        </button>
    </div>


    <div class="map">

        <div class="route-line" id="routeLine"></div>

        <div class="stops" id="stops"></div>

    </div>

    <div class="info" id="info"></div>

</section>


<script>

const routes = {

saptami:{
    name:"Saptamir Poth",
    color:"#16a34a",

    stops:[
        ["Garikhana",true],
        ["Alangidanga",true],
        ["Devimela",false],
        ["Dhobghata",true],
        ["Napitpara",false],
        ["Chasapara",false],
        ["Sarkarpara",false],
        ["Jeliapara",true],
        ["Amlapara",false],
        ["Darjipara",false],
        ["Garikhana",true]
    ]
},

astami:{
    name:"Astamir Poth",
    color:"#2563eb",

    stops:[
        ["Sadarpara",false],
        ["Union Club",false],
        ["Huchukpara",false],
        ["Cocks Compound",false],
        ["Amdhia",true],
        ["Nadhia",true],
        ["Dulmi",true],
        ["Ketika",true],
        ["B. B. Das Road",false],
        ["Madhyabazar",false],
        ["Chowkbazar",false],
        ["Sadarpara",false]
    ]
},

navami:{
    name:"Nabamir Poth",
    color:"#dc2626",

    stops:[
        ["Jeliapara",true],
        ["Chittaranjan Club",false],
        ["Namopara",false],
        ["Bhagabandhpara",false],
        ["Nilkhutidanga",false],
        ["Radhakrishna More",false],
        ["Dakbanglow",true],
        ["Stationpara",false],
        ["Locoshedpara",true],
        ["Telkalpara",true],
        ["Dhobghata",false],
        ["Napitpara",false],
        ["Jeliapara",true]
    ]
}

};


function openMap(){

    document.getElementById("home").style.display="none";
    document.getElementById("mapPage").style.display="block";

    showRoute("saptami");
}


function showRoute(routeName){

    const route=routes[routeName];

    document.documentElement.style.setProperty(
        "--routeColor",
        route.color
    );

    const stops=document.getElementById("stops");

    stops.innerHTML="";

    route.stops.forEach((place,index)=>{

        const div=document.createElement("div");

        div.className="stop";

        div.innerHTML=`
            <span class="dot"></span>
            <strong>${index+1}. ${place[0]}</strong>
            ${place[1] ? '<span class="food">🍴 Food</span>' : ''}
        `;

        div.onclick=()=>showPara(place[0],place[1],route.name);

        stops.appendChild(div);
    });

    const line=document.getElementById("routeLine");

    line.style.setProperty("--routeColor",route.color);

    line.style.animation="none";

    setTimeout(()=>{
        line.style.animation="drawRoute 1.5s forwards";
    },20);

    document.querySelectorAll(".route-btn")
        .forEach(btn=>btn.classList.remove("active"));

    if(routeName==="saptami")
        document.querySelector(".green").classList.add("active");

    if(routeName==="astami")
        document.querySelector(".blue").classList.add("active");

    if(routeName==="navami")
        document.querySelector(".red").classList.add("active");

    document.getElementById("info").style.display="none";
}


function showPara(name,hasFood,route){

    const info=document.getElementById("info");

    info.style.display="block";

    let foodHTML="";

    if(hasFood){

        foodHTML=`
        <h3>🍴 Food Available</h3>

        <div class="food-list">
            <span class="food-item">🌯 Egg Roll</span>
            <span class="food-item">🍜 Chowmein</span>
            <span class="food-item">🌶️ Fuchka</span>
            <span class="food-item">🍦 Ice Cream</span>
            <span class="food-item">🥤 Cold Drink</span>
        </div>
        `;
    }

    info.innerHTML=`

        <h2>🛕 ${name}</h2>

        <p>📍 ${route}</p>

        <div class="mike" onclick="playSong('${name}')">
            🎤
        </div>

        <p>Tap the microphone to play this para's song 🎶</p>

        ${foodHTML}

    `;

    info.scrollIntoView({
        behavior:"smooth"
    });
}


function playSong(name){

    alert(
        "🎵 Song for "+name+
        "\\n\\nMusic file will be added here later."
    );

}

</script>

</body>
</html>
