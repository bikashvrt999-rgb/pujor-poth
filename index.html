<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pujor Poth</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#08060d;
  color:#fff;
  overflow-x:hidden;
}

/* HOME */

#home{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#751525,#300b18 35%,#08060d 75%);
}

.homeBox{
  position:relative;
  z-index:2;
}

.lamp{
  font-size:75px;
  animation:lamp 2s infinite alternate;
}

@keyframes lamp{
  from{filter:drop-shadow(0 0 5px orange)}
  to{filter:drop-shadow(0 0 35px orange)}
}

.logo{
  margin-top:12px;
  font-size:clamp(42px,12vw,78px);
  font-weight:900;
  letter-spacing:4px;
  color:#ffd76a;
  text-shadow:0 0 12px #ff9d00,0 0 35px #ff4500;
}

.tagline{
  margin-top:10px;
  color:#ffe1e1;
  font-size:18px;
}

.enter{
  margin-top:38px;
  padding:16px 30px;
  border:0;
  border-radius:40px;
  background:linear-gradient(45deg,#e62b16,#ff9d00);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 0 30px #ff5b00;
  cursor:pointer;
}

/* MAP PAGE */

#mapPage{
  display:none;
  min-height:100vh;
  padding:25px 14px 60px;
  background:
    radial-gradient(circle at top,#351020,#09060e 60%);
}

.title{
  text-align:center;
}

.title h1{
  color:#ffd76a;
  font-size:38px;
  text-shadow:0 0 15px orange;
}

.title p{
  margin-top:7px;
  color:#cbbdc5;
}

/* ROUTES */

.routes{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin:24px auto;
}

.routeBtn{
  border:1px solid #ffffff25;
  background:#ffffff09;
  color:#fff;
  padding:12px 15px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.routeBtn.active{
  transform:scale(1.05);
}

.green.active{
  background:#159447;
  box-shadow:0 0 25px #159447;
}

.blue.active{
  background:#2563eb;
  box-shadow:0 0 25px #2563eb;
}

.red.active{
  background:#dc2626;
  box-shadow:0 0 25px #dc2626;
}

/* MAP */

.map{
  position:relative;
  max-width:700px;
  height:700px;
  margin:auto;
  border-radius:30px;
  overflow:hidden;
  border:1px solid #ffffff20;

  background:
    linear-gradient(135deg,#15121e,#251327);

  box-shadow:0 0 45px #000;
}

/* map roads */

.road{
  position:absolute;
  background:#ffffff07;
  border:1px solid #ffffff0b;
}

.road1{
  width:130%;
  height:55px;
  top:130px;
  left:-15%;
  transform:rotate(17deg);
}

.road2{
  width:130%;
  height:45px;
  top:370px;
  left:-15%;
  transform:rotate(-14deg);
}

.road3{
  width:60%;
  height:45px;
  top:500px;
  left:20%;
  transform:rotate(30deg);
}

/* route SVG */

svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.routePath{
  fill:none;
  stroke:var(--route);
  stroke-width:5;
  stroke-linecap:round;
  stroke-dasharray:12 12;
  filter:drop-shadow(0 0 7px var(--route));
  animation:routeMove 1s linear infinite;
}

@keyframes routeMove{
  to{
    stroke-dashoffset:-24;
  }
}

/* MARKERS */

.markers{
  position:absolute;
  inset:0;
}

.marker{
  position:absolute;
  transform:translate(-50%,-50%);
  width:46px;
  height:46px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#17131d;
  border:3px solid var(--route);
  box-shadow:0 0 18px var(--route);
  cursor:pointer;
  z-index:5;
  transition:.3s;
}

.marker:hover{
  transform:translate(-50%,-50%) scale(1.18);
}

.marker span{
  font-size:20px;
}

.foodIcon{
  position:absolute;
  right:-7px;
  top:-8px;
  font-size:15px;
  background:#ff9d00;
  border-radius:50%;
  width:21px;
  height:21px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* START */

.startPoint{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:8;
  padding:10px 18px;
  border-radius:25px;
  background:#ffffff12;
  border:1px solid #ffffff25;
  color:#ffd76a;
  font-size:12px;
}

/* PARA CARD */

.info{
  max-width:650px;
  margin:25px auto 0;
  padding:25px;
  border-radius:25px;
  background:#ffffff09;
  border:1px solid #ffffff18;
  display:none;
  animation:up .4s ease;
}

@keyframes up{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.info h2{
  color:#ffd76a;
  margin-bottom:8px;
}

.mike{
  width:72px;
  height:72px;
  margin:18px auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:#ffffff12;
  border:1px solid #ffffff20;
  cursor:pointer;
  box-shadow:0 0 20px #ffffff20;
}

.foodTitle{
  margin-top:15px;
  color:#ffd76a;
}

.foods{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.food{
  padding:8px 12px;
  border-radius:20px;
  background:#ff7b1830;
  border:1px solid #ff9d0040;
  font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

  .map{
    height:650px;
  }

  .marker{
    width:40px;
    height:40px;
  }

  .marker span{
    font-size:17px;
  }

}
</style>
</head>

<body>

<!-- HOME -->

<section id="home">

  <div class="homeBox">

    <div class="lamp">🪔</div>

    <div class="logo">PUJOR POTH</div>

    <div class="tagline">
      পথে পথে পুজোর গল্প
    </div>

    <button class="enter" onclick="openMap()">
      🗺️ ENTER PUJOR POTH
    </button>

  </div>

</section>


<!-- MAP -->

<section id="mapPage">

  <div class="title">
    <h1>🪔 PUJOR POTH</h1>
    <p>Choose your Puja route</p>
  </div>


  <div class="routes">

    <button class="routeBtn green"
      onclick="showRoute('saptami')">
      🟢 Saptamir Poth
    </button>

    <button class="routeBtn blue"
      onclick="showRoute('astami')">
      🔵 Astamir Poth
    </button>

    <button class="routeBtn red"
      onclick="showRoute('navami')">
      🔴 Nabamir Poth
    </button>

  </div>


  <div class="map">

    <div class="road road1"></div>
    <div class="road road2"></div>
    <div class="road road3"></div>

    <svg viewBox="0 0 700 700">
      <path id="routePath"
        class="routePath"
        d="">
      </path>
    </svg>

    <div id="markers" class="markers"></div>

    <div class="startPoint">
      🪔 PUJA ROUTE
    </div>

  </div>


  <div id="info" class="info"></div>

</section>


<script>

/* ROUTES */

const routes={

saptami:{
 name:"Saptamir Poth",
 color:"#16a34a",

 stops:[
  ["Garikhana",true],
  ["Alangidanga",true],
  ["Devimela",false],
  ["Dhobghata",true],
  ["Napitpara",false],
  ["Chasapara",false],
  ["Sarkarpara",false],
  ["Jeliapara",true],
  ["Amlapara",false],
  ["Darjipara",false],
  ["Garikhana",true]
 ],

 positions:[
  [50,12],[72,17],[80,29],[68,40],
  [48,48],[28,45],[20,57],[34,69],
  [55,75],[72,66],[50,88]
 ]
},

astami:{
 name:"Astamir Poth",
 color:"#2563eb",

 stops:[
  ["Sadarpara",false],
  ["Union Club",false],
  ["Huchukpara",false],
  ["Cocks Compound",false],
  ["Amdhia",true],
  ["Nadhia",true],
  ["Dulmi",true],
  ["Ketika",true],
  ["B. B. Das Road",false],
  ["Madhyabazar",false],
  ["Chowkbazar",false],
  ["Sadarpara",false]
 ],

 positions:[
  [50,12],[28,18],[20,30],[32,40],
  [55,34],[72,26],[82,40],[73,53],
  [58,63],[38,69],[25,80],[50,88]
 ]
},

navami:{
 name:"Nabamir Poth",
 color:"#dc2626",

 stops:[
  ["Jeliapara",true],
  ["Chittaranjan Club",false],
  ["Namopara",false],
  ["Bhagabandhpara",false],
  ["Nilkhutidanga",false],
  ["Radhakrishna More",false],
  ["Dakbanglow",true],
  ["Stationpara",false],
  ["Locoshedpara",true],
  ["Telkalpara",true],
  ["Dhobghata",false],
  ["Napitpara",false],
  ["Jeliapara",true]
 ],

 positions:[
  [50,10],[70,15],[82,27],[74,38],
  [57,34],[40,28],[27,40],[22,55],
  [35,67],[52,60],[70,68],[76,80],[50,90]
 ]

}

};


/* OPEN */

function openMap(){

 document.getElementById("home").style.display="none";

 document.getElementById("mapPage").style.display="block";

 window.scrollTo(0,0);

 showRoute("saptami");
}


/* ROUTE */

function showRoute(name){

 const route=routes[name];

 document.documentElement.style
 .setProperty("--route",route.color);


 const markers=
 document.getElementById("markers");

 markers.innerHTML="";


 /* SVG ROUTE */

 let path="";

 route.positions.forEach((p,i)=>{

   const x=p[0]*7;
   const y=p[1]*7;

   if(i===0){
     path+=`M ${x} ${y}`;
   }else{
     path+=` L ${x} ${y}`;
   }

 });


 document.getElementById("routePath")
 .setAttribute("d",path);


 /* MARKERS */

 route.stops.forEach((place,i)=>{

   const marker=
   document.createElement("div");

   marker.className="marker";

   marker.style.left=
   route.positions[i][0]+"%";

   marker.style.top=
   route.positions[i][1]+"%";

   marker.innerHTML=`
      <span>🛕</span>
      ${
        place[1]
        ? '<div class="foodIcon">🍴</div>'
        : ''
      }
   `;

   marker.onclick=function(){
     showPara(place[0],place[1],route.name);
   };

   markers.appendChild(marker);

 });


 document.querySelectorAll(".routeBtn")
 .forEach(b=>b.classList.remove("active"));


 if(name==="saptami")
 document.querySelector(".green").classList.add("active");

 if(name==="astami")
 document.querySelector(".blue").classList.add("active");

 if(name==="navami")
 document.querySelector(".red").classList.add("active");


 document.getElementById("info")
 .style.display="none";

}


/* PARA */

function showPara(name,hasFood,route){

 const info=document.getElementById("info");

 let food="";

 if(hasFood){

  food=`
    <div class="foodTitle">
      🍴 Food Available
    </div>

    <div class="foods">
      <div class="food">🌯 Egg Roll</div>
      <div class="food">🍜 Chowmein</div>
      <div class="food">🌶️ Fuchka</div>
      <div class="food">🍦 Ice Cream</div>
      <div class="food">🥤 Cold Drink</div>
    </div>
  `;

 }else{

  food=`
    <p style="margin-top:15px;color:#888">
      🍴 Food information coming soon
    </p>
  `;

 }


 info.innerHTML=`

   <h2>🛕 ${name}</h2>

   <p>📍 ${route}</p>

   <div class="mike"
     onclick="playSong('${name}')">
     🎤
   </div>

   <p style="text-align:center">
     Tap the Mike to play this para's song 🎶
   </p>

   ${food}

 `;

 info.style.display="block";

 info.scrollIntoView({
   behavior:"smooth",
   block:"center"
 });

}


/* MUSIC */

function playSong(name){

 alert(
   "🎵 "+name+
   "\\n\\nএই পাড়ার আলাদা গান এখানে পরে বসানো হবে।"
 );

}

</script>

</body>
</html>
